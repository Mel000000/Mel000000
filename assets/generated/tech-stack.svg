<svg xmlns="http://www.w3.org/2000/svg" width="850" height="240" viewBox="0 0 850 240">
  <defs/>

  <!-- Card background -->
  <rect x="0.5" y="0.5" width="849" height="239" rx="12" ry="12"
        fill="#0f1623" stroke="#1a2332" stroke-width="1"/>

  <!-- Left: Language Telemetry -->
  <text x="30" y="38" fill="#64748b" font-size="11" font-family="monospace" letter-spacing="3">LANGUAGE TELEMETRY</text>

  <!-- Vertical divider -->
  <line x1="425" y1="25" x2="425" y2="215" stroke="#1a2332" stroke-width="1" opacity="0.4"/>

  <!-- Right: Focus Sectors heading -->
  <text x="460" y="38" fill="#64748b" font-size="11" font-family="monospace" letter-spacing="3">FOCUS SECTORS</text>

  <!-- JavaScript row -->
  <g transform="translate(30, 65)">
    <text x="0" y="0" fill="#94a3b8" font-size="11" font-family="sans-serif" dominant-baseline="middle">JavaScript</text>
    <rect x="110" y="-6" width="116.0" height="12" rx="3" fill="#f1e05a" opacity="0.85">
      <animate attributeName="width" from="0" to="116.0" dur="0.8s" begin="0.0s" fill="freeze"/>
    </rect>
    <text x="320" y="0" fill="#64748b" font-size="10" font-family="monospace" dominant-baseline="middle">58.0%</text>
  </g>

  <!-- TypeScript row -->
  <g transform="translate(30, 87)">
    <text x="0" y="0" fill="#94a3b8" font-size="11" font-family="sans-serif" dominant-baseline="middle">TypeScript</text>
    <rect x="110" y="-6" width="40.0" height="12" rx="3" fill="#3178c6" opacity="0.85">
      <animate attributeName="width" from="0" to="40.0" dur="0.8s" begin="0.1s" fill="freeze"/>
    </rect>
    <text x="320" y="0" fill="#64748b" font-size="10" font-family="monospace" dominant-baseline="middle">20.0%</text>
  </g>

  <!-- YAML / IaC row -->
  <g transform="translate(30, 109)">
    <text x="0" y="0" fill="#94a3b8" font-size="11" font-family="sans-serif" dominant-baseline="middle">YAML / IaC</text>
    <rect x="110" y="-6" width="44.0" height="12" rx="3" fill="#cb171e" opacity="0.85">
      <animate attributeName="width" from="0" to="44.0" dur="0.8s" begin="0.2s" fill="freeze"/>
    </rect>
    <text x="320" y="0" fill="#64748b" font-size="10" font-family="monospace" dominant-baseline="middle">22.0%</text>
  </g>

  <!-- ── Radar chart (center 637, 130) ── -->

  <!-- Grid rings -->
  <polygon points='637.0,111.2 649.1,115.6 655.5,126.7 653.2,139.4 643.4,147.6 630.6,147.6 620.8,139.4 618.5,126.7 624.9,115.6' fill='none' stroke='#1a2332' stroke-width='0.8' opacity='0.6'/>
  <polygon points='637.0,92.5 661.1,101.3 673.9,123.5 669.5,148.8 649.8,165.2 624.2,165.2 604.5,148.8 600.1,123.5 612.9,101.3' fill='none' stroke='#1a2332' stroke-width='0.8' opacity='0.6'/>
  <polygon points='637.0,73.8 673.2,86.9 692.4,120.2 685.7,158.1 656.2,182.9 617.8,182.9 588.3,158.1 581.6,120.2 600.8,86.9' fill='none' stroke='#1a2332' stroke-width='0.8' opacity='0.6'/>
  <polygon points='637.0,55.0 685.2,72.5 710.9,117.0 702.0,167.5 662.7,200.5 611.3,200.5 572.0,167.5 563.1,117.0 588.8,72.5' fill='none' stroke='#1a2332' stroke-width='0.8' opacity='0.6'/>

  <!-- Axis spokes -->
  <line x1='637.0' y1='130.0' x2='637.0' y2='55.0'  stroke='#1a2332' stroke-width='0.8' opacity='0.5'/>
  <line x1='637.0' y1='130.0' x2='685.2' y2='72.5'  stroke='#1a2332' stroke-width='0.8' opacity='0.5'/>
  <line x1='637.0' y1='130.0' x2='710.9' y2='117.0' stroke='#1a2332' stroke-width='0.8' opacity='0.5'/>
  <line x1='637.0' y1='130.0' x2='702.0' y2='167.5' stroke='#1a2332' stroke-width='0.8' opacity='0.5'/>
  <line x1='637.0' y1='130.0' x2='662.7' y2='200.5' stroke='#1a2332' stroke-width='0.8' opacity='0.5'/>
  <line x1='637.0' y1='130.0' x2='611.3' y2='200.5' stroke='#1a2332' stroke-width='0.8' opacity='0.5'/>
  <line x1='637.0' y1='130.0' x2='572.0' y2='167.5' stroke='#1a2332' stroke-width='0.8' opacity='0.5'/>
  <line x1='637.0' y1='130.0' x2='563.1' y2='117.0' stroke='#1a2332' stroke-width='0.8' opacity='0.5'/>
  <line x1='637.0' y1='130.0' x2='588.8' y2='72.5'  stroke='#1a2332' stroke-width='0.8' opacity='0.5'/>

  <!-- Expectation polygon (dashed) -->
  <polygon points='637.0,73.8 673.2,86.9 688.7,120.9 679.2,154.4 653.7,175.8 620.3,175.8 591.5,156.3 592.7,122.2 608.1,95.5' fill='rgba(110,118,129,0.08)' stroke='#6e7681' stroke-width='1' stroke-dasharray='3,2' opacity='0.7'/>

  <!-- Melina polygon (DevOps + Sys design bumped up to reflect the observability stack) -->
  <polygon points='637.0,73.8 668.3,92.7 682.8,121.9 692.3,161.9 653.7,175.8 617.0,185.0 609.7,145.8 591.2,121.9 597.5,82.9' fill='rgba(127,119,221,0.15)' stroke='#7f77dd' stroke-width='1.5'/>

  <!-- Melina dots -->
  <circle cx='637.0' cy='73.8'  r='3' fill='#7f77dd'/>
  <circle cx='668.3' cy='92.7'  r='3' fill='#7f77dd'/>
  <circle cx='682.8' cy='121.9' r='3' fill='#7f77dd'/>
  <circle cx='692.3' cy='161.9' r='3' fill='#7f77dd'/>
  <circle cx='653.7' cy='175.8' r='3' fill='#7f77dd'/>
  <circle cx='617.0' cy='185.0' r='3' fill='#7f77dd'/>
  <circle cx='609.7' cy='145.8' r='3' fill='#7f77dd'/>
  <circle cx='591.2' cy='121.9' r='3' fill='#7f77dd'/>
  <circle cx='597.5' cy='82.9'  r='3' fill='#7f77dd'/>

  <!-- Expectation dots -->
  <circle cx='637.0' cy='73.8'  r='2' fill='#6e7681'/>
  <circle cx='673.2' cy='86.9'  r='2' fill='#6e7681'/>
  <circle cx='688.7' cy='120.9' r='2' fill='#6e7681'/>
  <circle cx='679.2' cy='154.4' r='2' fill='#6e7681'/>
  <circle cx='653.7' cy='175.8' r='2' fill='#6e7681'/>
  <circle cx='620.3' cy='175.8' r='2' fill='#6e7681'/>
  <circle cx='591.5' cy='156.3' r='2' fill='#6e7681'/>
  <circle cx='592.7' cy='122.2' r='2' fill='#6e7681'/>
  <circle cx='608.1' cy='95.5'  r='2' fill='#6e7681'/>

  <!-- Axis labels -->
  <text x='637.0' y='42.0'  fill='#64748b' font-size='8' font-family='monospace' text-anchor='middle' dominant-baseline='middle'>Frontend</text>
  <text x='693.6' y='62.6'  fill='#64748b' font-size='8' font-family='monospace' text-anchor='start'  dominant-baseline='middle'>Backend</text>
  <text x='723.7' y='114.7' fill='#64748b' font-size='8' font-family='monospace' text-anchor='start'  dominant-baseline='middle'>Databases</text>
  <text x='713.2' y='174.0' fill='#64748b' font-size='8' font-family='monospace' text-anchor='start'  dominant-baseline='middle'>DevOps</text>
  <text x='667.1' y='214.0' fill='#64748b' font-size='8' font-family='monospace' text-anchor='middle' dominant-baseline='middle'>Cloud</text>
  <text x='606.9' y='214.0' fill='#64748b' font-size='8' font-family='monospace' text-anchor='middle' dominant-baseline='middle'>Security</text>
  <text x='560.8' y='174.0' fill='#64748b' font-size='8' font-family='monospace' text-anchor='end'    dominant-baseline='middle'>Testing</text>
  <text x='550.3' y='114.7' fill='#64748b' font-size='8' font-family='monospace' text-anchor='end'    dominant-baseline='middle'>Sys design</text>
  <text x='580.4' y='62.6'  fill='#64748b' font-size='8' font-family='monospace' text-anchor='end'    dominant-baseline='middle'>Tooling</text>

  <!-- Legend -->
  <rect x='460' y='220' width='8' height='6' rx='1' fill='#7f77dd'/>
  <text x='472' y='223' fill='#64748b' font-size='8' font-family='monospace' dominant-baseline='middle'>Skills</text>
  <rect x='518' y='220' width='8' height='6' rx='1' fill='none' stroke='#6e7681' stroke-width='1' stroke-dasharray='2,1'/>
  <text x='530' y='223' fill='#64748b' font-size='8' font-family='monospace' dominant-baseline='middle'>Goals</text>

</svg>
